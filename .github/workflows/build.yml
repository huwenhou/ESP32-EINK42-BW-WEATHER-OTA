name: Build & publish firmware

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "web/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set firmware version = build number
        run: |
          echo "#pragma once" > firmware/weather/version.h
          echo "#define FW_VERSION ${{ github.run_number }}" >> firmware/weather/version.h

      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core & libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "GxEPD2" "Adafruit GFX Library" "WiFiManager" "U8g2_for_Adafruit_GFX" "ArduinoJson"

      - name: Generate Barlow digit fonts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libfreetype-dev
          FC=$(find ~/Arduino/libraries -path "*fontconvert/fontconvert.c" | head -1)
          gcc -O2 -I/usr/include/freetype2 "$FC" -lfreetype -o fontconvert
          curl -sSL -o Barlow-Bold.ttf https://github.com/google/fonts/raw/main/ofl/barlow/Barlow-Bold.ttf
          ./fontconvert Barlow-Bold.ttf 33 32 58 > firmware/weather/Barlow_Bold33pt7b.h
          ./fontconvert Barlow-Bold.ttf 14 32 126 > firmware/weather/Barlow_Bold14pt7b.h
          head -c 200 firmware/weather/Barlow_Bold33pt7b.h
          cp firmware/weather/Barlow_Bold*pt7b.h firmware/weather_old/

      - name: Compile
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build \
            firmware/weather 2>&1 | tee compile.log || {
              grep -iE "error|exceed|overflow|not declared|no such|no matching|was not|Sketch uses" compile.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }
          grep -E "Sketch uses|Global variables" compile.log | while IFS= read -r l; do echo "::notice::$l"; done

      # 老款屏 HINK-E042A03-A1（双 SSD1608）：版本号固定在 firmware/weather_old/version.h，不走 OTA
      - name: Compile (old panel)
        run: |
          set -o pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32:PartitionScheme=min_spiffs \
            --output-dir build_old \
            firmware/weather_old 2>&1 | tee compile_old.log || {
              grep -iE "error|exceed|overflow|not declared|no such|no matching|was not|Sketch uses" compile_old.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
              exit 1
            }
          grep -E "Sketch uses|Global variables" compile_old.log | while IFS= read -r l; do echo "::notice::old: $l"; done

      - name: Prepare site
        run: |
          mkdir -p site
          cp build/weather.ino.bin site/firmware.bin
          cp build/weather.ino.merged.bin site/firmware.merged.bin
          echo "${{ github.run_number }}" > site/version.txt
          cat > site/manifest.json <<EOF
          {
            "name": "ESP32 墨水屏天气看板",
            "version": "${{ github.run_number }}",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32",
                "parts": [ { "path": "firmware.merged.bin", "offset": 0 } ] }
            ]
          }
          EOF
          cp web/index.html site/index.html
          mkdir -p site/old
          cp build_old/weather_old.ino.bin site/old/firmware.bin
          cp build_old/weather_old.ino.merged.bin site/old/firmware.merged.bin
          # 老款独立 OTA 频道：version.txt 用整数 FW_VERSION，manifest 显示 FW_LABEL 里的版本
          grep -oP 'define FW_VERSION\s+\K[0-9]+' firmware/weather_old/version.h > site/old/version.txt
          OLDLABEL=$(grep -oP 'FW_LABEL\s+"\K[^"]+' firmware/weather_old/version.h | grep -oP 'v\K[0-9.]+')
          cat > site/old/manifest.json <<EOF
          {
            "name": "ESP32 墨水屏天气看板（老款屏 HINK-E042A03）",
            "version": "$OLDLABEL",
            "new_install_prompt_erase": true,
            "builds": [
              { "chipFamily": "ESP32",
                "parts": [ { "path": "firmware.merged.bin", "offset": 0 } ] }
            ]
          }
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
